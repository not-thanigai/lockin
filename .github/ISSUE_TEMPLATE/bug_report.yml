name: Bug report
description: Report a reproducible LOCKIN defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: FND-002
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["P0 - Critical", "P1 - High", "P2 - Medium", "P3 - Low"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Remove personal data, tokens, account IDs, and device identifiers.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Android API, device/emulator, app version, offline/online
