name: Android emulator smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "maestro/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.js"
      - "tsconfig.json"
      - ".github/workflows/android-smoke.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "maestro/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.js"
      - "tsconfig.json"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - name: Verify generated Gradle wrapper
        run: test -f android/gradlew
      - name: Build, install, and run Maestro UI smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: .
          script: |
            set -eu
            cd "$GITHUB_WORKSPACE"
            capture_evidence() {
              adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > "$GITHUB_WORKSPACE/android-smoke-log.txt" 2>/dev/null || true
              adb exec-out screencap -p > "$GITHUB_WORKSPACE/android-smoke.png" 2>/dev/null || true
            }
            trap capture_evidence EXIT
            test -f android/gradlew
            cd "$GITHUB_WORKSPACE/android"
            bash ./gradlew assembleDebug
            cd "$GITHUB_WORKSPACE"
            adb install "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            curl -fsSL "https://get.maestro.mobile.dev" -o /tmp/install-maestro.sh
            bash /tmp/install-maestro.sh
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version
            set +e
            maestro test --format=JUNIT --output=maestro-test-results.xml --test-output-dir=maestro-output --debug-output=maestro-debug maestro/foundation-smoke.yaml
            maestro_status=$?
            set -e
            capture_evidence
            if grep -E "FATAL EXCEPTION|ReactNativeJS:.*(Error|Exception)" android-smoke-log.txt; then
              exit 1
            fi
            if ! adb shell pidof com.lockin.fitness; then
              echo "LOCKIN process was not running after the Maestro flow."
              maestro_status=1
            fi
            exit "$maestro_status"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_id }}
          path: |
            android-smoke-log.txt
            android-smoke.png
            android/app/build/outputs/apk/debug/app-debug.apk
            maestro-test-results.xml
            maestro-output/**
            maestro-debug/**
          if-no-files-found: warn
